spring.application.name=smart-canteen-backend
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_canteen?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET:replace-this-development-secret-with-at-least-32-bytes}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.seed-admin.email=${SEED_ADMIN_EMAIL:admin@greenbite.local}
app.seed-admin.password=${SEED_ADMIN_PASSWORD:GreenBite@2026}
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
